<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1180" cy="-40" r="220" fill="rgba(255,255,255,0.08)"/>
  <circle cx="-40" cy="700" r="200" fill="rgba(255,255,255,0.06)"/>

  <!-- Brand -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="90" y="90" width="56" height="56" rx="14" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)"/>
    <text x="118" y="130" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="700">&#9638;</text>
    <text x="160" y="132" font-size="27" fill="#ffffff" font-weight="700" letter-spacing="-0.3">QR Forge</text>

    <text x="90" y="245" font-size="54" fill="#ffffff" font-weight="800" letter-spacing="-0.5">Free QR Code Generator</text>
    <text x="90" y="300" font-size="22" fill="rgba(255,255,255,0.85)">Paste a link, customize colors &amp; logo,</text>
    <text x="90" y="332" font-size="22" fill="rgba(255,255,255,0.85)">download as PNG or SVG — instantly.</text>
  </g>

  <!-- QR-like graphic -->
  <g transform="translate(830,175)">
    <rect width="280" height="280" rx="28" fill="#ffffff"/>
    <g transform="translate(30,30)" fill="#14161a">
      <!-- top-left finder -->
