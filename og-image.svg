      <rect x="160" y="0" width="60" height="60"/>
      <rect x="174" y="14" width="32" height="32" fill="#ffffff"/>
      <rect x="184" y="24" width="12" height="12" fill="#14161a"/>
      <!-- bottom-left finder -->
      <rect x="0" y="160" width="60" height="60"/>
      <rect x="14" y="174" width="32" height="32" fill="#ffffff"/>
      <rect x="24" y="184" width="12" height="12" fill="#14161a"/>
      <!-- scattered modules -->
      <rect x="80" y="10" width="14" height="14"/>
      <rect x="110" y="10" width="14" height="14"/>
      <rect x="140" y="30" width="14" height="14"/>
      <rect x="80" y="40" width="14" height="14"/>
      <rect x="110" y="70" width="14" height="14"/>
      <rect x="140" y="90" width="14" height="14"/>
      <rect x="170" y="80" width="14" height="14"/>
      <rect x="190" y="100" width="14" height="14"/>
      <rect x="80" y="100" width="14" height="14"/>
      <rect x="20" y="80" width="14" height="14"/>
      <rect x="20" y="110" width="14" height="14"/>
      <rect x="50" y="100" width="14" height="14"/>
      <rect x="80" y="130" width="14" height="14"/>
      <rect x="110" y="130" width="14" height="14"/>
      <rect x="140" y="150" width="14" height="14"/>
      <rect x="170" y="140" width="14" height="14"/>
      <rect x="190" y="170" width="14" height="14"/>
      <rect x="80" y="170" width="14" height="14"/>
      <rect x="110" y="190" width="14" height="14"/>
      <rect x="140" y="190" width="14" height="14"/>
      <rect x="170" y="190" width="14" height="14"/>
      <rect x="80" y="190" width="14" height="14"/>
      <rect x="20" y="140" width="14" height="14"/>
